<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Market - Bem Vindo</title>

    <link rel="stylesheet" href="styles/welcome.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="/src/welcome.js" defer></script>
</head>

<body>
    <main id="app">
        <header id="title">
            <div id="logo">
                <img src="images/carrinho_compras_just.png" alt="" srcset="" id="cart">
                <h1 id="logo-text">EasyMarket</h1>
    
            </div>
        </header>
    
        <section id="content">
            <section id="users">
                <h2>Bem vindo, <span id="name"></span>!</h2>
    
                <h3>Gostaria de que...</h3>
        
            </section>
            
            <section id="options">
                <div id="primary" class="option">
                    <button class="btn">Montar lista</button>
                    <p>
                        Monte sua lista antes de sair de casa.
                    </p>

                </div>

                <div id="second" class="option">
                    <button class="btn">Compra Rápida</button>
                    <p>
                        Use durante as compras para controlar seus gastos em tempo real.
                    </p>

                </div>
            
            </section>
        </section>
    

    </main>
</body>

</html>
